[package]
name = "assetforge"
version = "1.0.8"
description = "One-Click Digital Asset Factory"
authors = ["AssetForge Team"]
license = "SEE LICENSE IN LICENSE"
repository = ""
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-message", "shell-open", "dialog-open", "path-all", "fs-read-file", "fs-write-file", "fs-read-dir", "shell-execute"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
log = "0.4"
simplelog = "0.12"
chrono = "0.4"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
