[project]
name = "assetforge-backend"
version = "0.1.0"
description = "AssetForge Python Backend"
authors = [{name = "AssetForge Team"}]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.12.0",
    "pydantic>=2.6.0",
    "orjson>=3.9.0",
    "jsonschema>=4.21.0",
    "tenacity>=8.2.0",
    "cryptography>=42.0.0",
    "keyring>=24.3.0",
    "platformdirs>=4.2.0",
    "rich>=13.7.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.1.0",
    "ruff>=0.2.0",
]
build = [
    "nuitka>=2.0.0",
    "ordered-set>=4.1.0",
    "zstandard>=0.22.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
